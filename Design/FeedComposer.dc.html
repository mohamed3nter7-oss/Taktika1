<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/colors.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/roles.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/typography.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/radius.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/motion.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/layout.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/tokens/base.css">
  <link rel="stylesheet" href="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/styles.css">
  <script src="_ds/taktika-design-system-be64d561-e576-4538-af88-be7dd68ee2fd/_ds_bundle.js"></script>
</helmet>
<sc-if value="{{ isCollapsed }}" hint-placeholder-val="{{ true }}">
  <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Card" padding="var(--space-4)" hint-size="100%,72px">
    <div style="display: flex; align-items: center; gap: var(--space-3); font-family: var(--font-latin)">
      <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Avatar" src="{{ avatar }}" name="{{ viewerName }}" size="md" hint-size="40px,40px"></x-import>
      <button type="button" onClick="{{ open }}" style="flex: 1; min-width: 0; height: 40px; padding-inline: var(--space-3); background: var(--surface-sunken); color: var(--text-secondary); border: 1px solid var(--border-default); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-body-size); text-align: start; cursor: pointer; transition: border-color var(--duration-fast) var(--ease-in-out)" style-hover="border-color: var(--border-strong); color: var(--text-primary)">Share something with the network</button>
      <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.IconButton" icon="image" label="Add image" size="md" on-click="{{ open }}" hint-size="40px,40px"></x-import>
    </div>
  </x-import>
</sc-if>

<sc-if value="{{ isExpanded }}" hint-placeholder-val="{{ false }}">
  <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Card" hint-size="100%,320px">
    <div style="display: grid; gap: var(--space-4); font-family: var(--font-latin)">
      <div style="display: flex; align-items: flex-start; gap: var(--space-3)">
        <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Avatar" src="{{ avatar }}" name="{{ viewerName }}" size="md" hint-size="40px,40px"></x-import>
        <div style="flex: 1; min-width: 0; position: relative">
          <textarea aria-label="Write a post" dir="auto" value="{{ text }}" onChange="{{ edit }}" rows="{{ rows }}" style="display: block; width: 100%; min-height: 96px; field-sizing: content; overflow: hidden; background: transparent; color: var(--text-primary); border: none; border-radius: var(--radius-md); resize: none; padding: var(--space-2) 0; font-family: inherit; font-size: var(--text-body-lg-size); line-height: var(--text-body-lg-lh)"></textarea>
          <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ true }}">
            <span style="position: absolute; inset-block-start: var(--space-2); inset-inline-start: 0; color: var(--text-muted); font-size: var(--text-body-lg-size); line-height: var(--text-body-lg-lh); pointer-events: none">Share something with the network</span>
          </sc-if>
        </div>
      </div>

      <sc-if value="{{ showCounter }}" hint-placeholder-val="{{ false }}">
        <div aria-live="polite" style="justify-self: end; font-size: var(--text-sm-size); line-height: var(--text-sm-lh); color: var(--text-secondary); font-variant-numeric: tabular-nums">{{ counterText }}</div>
      </sc-if>

      <sc-if value="{{ hasImages }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: flex-start; gap: var(--space-2); flex-wrap: wrap">
          <sc-for list="{{ images }}" as="img" hint-placeholder-count="3">
            <sc-if value="{{ img.ok }}" hint-placeholder-val="{{ true }}">
              <div style="position: relative; width: 80px; height: 80px; border-radius: var(--radius-md); overflow: hidden; background: var(--surface-image-plate); border: 1px solid var(--border-default)">
                <img src="{{ img.src }}" alt="" style="width: 100%; height: 100%; display: block; object-fit: cover">
                <button type="button" aria-label="Remove image" style="position: absolute; inset-block-start: var(--space-1); inset-inline-end: var(--space-1); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; background: var(--surface-overlay); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: var(--radius-full); cursor: pointer" style-hover="background: var(--surface-base)">
                  <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Icon" name="x" size="{{ n14 }}" hint-size="14px,14px"></x-import>
                </button>
              </div>
            </sc-if>
            <sc-if value="{{ img.uploading }}" hint-placeholder-val="{{ false }}">
              <div style="position: relative; width: 80px; height: 80px; border-radius: var(--radius-md); overflow: hidden; background: var(--surface-image-plate); border: 1px solid var(--border-default)">
                <img src="{{ img.src }}" alt="" style="width: 100%; height: 100%; display: block; object-fit: cover">
                <button type="button" aria-label="Cancel upload" style="position: absolute; inset-block-start: var(--space-1); inset-inline-end: var(--space-1); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; background: var(--surface-overlay); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: var(--radius-full); cursor: pointer">
                  <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Icon" name="x" size="{{ n14 }}" hint-size="14px,14px"></x-import>
                </button>
                <div role="progressbar" aria-label="Uploading image" style="position: absolute; inset-block-end: 0; inset-inline: 0; height: 4px; background: var(--surface-sunken)">
                  <div style="height: 100%; background: var(--color-accent); width: {{ img.pct }}"></div>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{ img.failed }}" hint-placeholder-val="{{ false }}">
              <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; border-radius: var(--radius-md); background: var(--surface-sunken); border: 1px solid var(--color-danger)">
                <button type="button" aria-label="Retry upload" style="display: flex; align-items: center; justify-content: center; gap: 2px; height: 28px; padding-inline: var(--space-2); background: var(--surface-overlay); color: var(--color-danger-text); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-family: inherit; font-size: var(--text-xs-size); font-weight: 500; cursor: pointer" style-hover="background: var(--color-danger-tint)">
                  <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Icon" name="rotate-ccw" size="{{ n14 }}" hint-size="14px,14px"></x-import>Retry
                </button>
                <button type="button" aria-label="Remove image" style="position: absolute; inset-block-start: var(--space-1); inset-inline-end: var(--space-1); display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; background: var(--surface-overlay); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: var(--radius-full); cursor: pointer">
                  <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Icon" name="x" size="{{ n14 }}" hint-size="14px,14px"></x-import>
                </button>
              </div>
            </sc-if>
          </sc-for>

          <sc-if value="{{ canAdd }}" hint-placeholder-val="{{ true }}">
            <button type="button" style="display: grid; place-items: center; gap: 2px; width: 80px; height: 80px; background: var(--surface-sunken); color: var(--text-secondary); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-xs-size); font-weight: 500; cursor: pointer" style-hover="color: var(--text-primary); border-color: var(--border-accent)">
              <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Icon" name="plus" size="{{ n20 }}" hint-size="20px,20px"></x-import>Add image
            </button>
          </sc-if>
          <sc-if value="{{ addFull }}" hint-placeholder-val="{{ false }}">
            <button type="button" disabled="{{ true }}" style="display: grid; place-items: center; gap: 2px; width: 80px; height: 80px; background: var(--surface-sunken); color: var(--text-muted); border: 1px dashed var(--border-default); border-radius: var(--radius-md); font-family: inherit; font-size: var(--text-xs-size); font-weight: 500; cursor: not-allowed">
              <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Icon" name="plus" size="{{ n20 }}" hint-size="20px,20px"></x-import>Add image
            </button>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ addFull }}" hint-placeholder-val="{{ false }}">
        <div style="font-size: var(--text-sm-size); line-height: var(--text-sm-lh); color: var(--text-secondary)">Nine images is the maximum. Remove one to add another.</div>
      </sc-if>
      <sc-if value="{{ hasFailed }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm-size); line-height: var(--text-sm-lh); color: var(--color-danger-text)">
          <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Icon" name="circle-alert" size="{{ n16 }}" hint-size="16px,16px"></x-import>{{ failedText }}
        </div>
      </sc-if>

      <div>
        <div style="height: 1px; background: var(--border-subtle); margin: 0 calc(var(--space-5) * -1) var(--space-4)"></div>
        <div style="display: flex; align-items: center; gap: var(--space-2)">
          <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.IconButton" icon="image" label="Add image" size="md" hint-size="40px,40px"></x-import>
          <div style="display: flex; align-items: center; gap: var(--space-2); margin-inline-start: auto">
            <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Button" variant="ghost" on-click="{{ close }}" hint-size="84px,40px">Cancel</x-import>
            <x-import component-from-global-scope="TaktikaDesignSystem_be64d5.Button" variant="primary" disabled="{{ postDisabled }}" hint-size="76px,40px">Post</x-import>
          </div>
        </div>
      </div>
    </div>
  </x-import>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:604,&quot;height&quot;:360},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;collapsed&quot;,&quot;expanded&quot;],&quot;default&quot;:&quot;collapsed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;charCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;images&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;array&quot;},&quot;avatar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;viewerName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;You&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const num = (n) => Number(n || 0).toLocaleString('en-GB');

class Component extends DCLogic {
  state = { mode: null, text: null };

  renderVals() {
    const mode = this.state.mode || this.props.mode || 'collapsed';
    const text = this.state.text === null ? (this.props.text || '') : this.state.text;
    const imgs = (this.props.images || []).map((im) => ({
      src: im.src,
      ok: (im.state || 'done') === 'done',
      uploading: im.state === 'uploading',
      failed: im.state === 'failed',
      pct: (im.pct == null ? 0 : im.pct) + '%',
    }));
    const failed = imgs.filter((i) => i.failed).length;
    // The counter only exists in the last 200 of 3000. charCount lets an artboard
    // sit near the limit without pasting 2,800 characters of body copy.
    const chars = this.props.charCount == null ? text.length : this.props.charCount;

    return {
      n14: 14, n16: 16, n20: 20,
      isCollapsed: mode === 'collapsed', isExpanded: mode === 'expanded',
      open: () => this.setState({ mode: 'expanded' }),
      close: () => this.setState({ mode: 'collapsed' }),
      avatar: this.props.avatar, viewerName: this.props.viewerName || 'You',
      text, isEmpty: text.length === 0,
      // Fallback for browsers without field-sizing: estimate wrapped lines, not just newlines.
      rows: Math.max(3, Math.min(10, text.split('\n').reduce((n, line) => n + Math.max(1, Math.ceil(line.length / 58)), 0))),
      edit: (e) => this.setState({ text: e.target.value }),
      showCounter: chars > 2800, counterText: num(chars) + ' / 3,000',
      images: imgs, hasImages: imgs.length > 0,
      canAdd: imgs.length > 0 && imgs.length < 9,
      addFull: imgs.length >= 9,
      hasFailed: failed > 0,
      failedText: failed === 1
        ? 'One image failed to upload. Retry or remove it — the others are ready.'
        : failed + ' images failed to upload. Retry or remove them — the others are ready.',
      postDisabled: text.trim().length === 0,
    };
  }
}

</script>
</body>
</html>
